# Single workflow that drives versioning, releases, documentation and release assets.
#
# Flow:
#   1. release - on every push to main/master, python-semantic-release reads the Conventional
#                Commits since the last tag. If any is releasable (feat, fix, perf, breaking), it
#                bumps package.json's version, updates CHANGELOG.md, pushes a release commit + tag
#                and creates the GitHub Release. Config: .github/release.toml.
#   2. build   - generates the C# API reference with SideXP.Instadoc (skipped automatically when the
#                package ships no C# sources, e.g. asset-only packages), builds the Zensical site and,
#                after a release, attaches source + documentation archives to the Release.
#   3. deploy  - deploys the site built by `build` to GitHub Pages.
#
# Because the release commit, tag and Release are created with the default GITHUB_TOKEN, they do
# NOT trigger other workflows (no release loop). So docs + assets run in THIS run, gated on the
# release job's output, and check out the release tag (the pushed commit predates the version bump).
name: Release

on:
  push:
    branches:
      - main
      - master
  # Allows rebuilding/redeploying the docs without cutting a release.
  workflow_dispatch:

jobs:
  # 0. Template guard
  # Skips the whole workflow while the repo is still an unconfigured template, on two fronts:
  #   - the template repo itself (`is_template`), and
  #   - a repo just generated from the template whose package.json still holds `@todo` placeholders
  #     (you can't release a package literally named `com.side-xp.@todo`, nor publish @todo docs).
  # Once `@todo` is gone from package.json, the workflow activates automatically.
  guard:
    name: Check template configured
    runs-on: ubuntu-latest
    if: "!github.event.repository.is_template"
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Detect unconfigured template
        id: check
        run: |
          if grep -q '@todo' package.json; then
            echo "package.json still contains @todo placeholders - template not configured yet; skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  # 1. Versioning & releases
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.configured == 'true' && github.event_name == 'push'
    # Queue (never cancel) releases, so two quick pushes can't compute a version from the same history.
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # Check out the branch (not a detached sha) so the release commit can be pushed to it.
      # No full history needed here: python-semantic-release unshallows the clone itself.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # If the branch moved since this run was triggered, release only what was pushed. The push of
      # the release commit then fails as non-fast-forward, and the newer run releases the rest.
      - name: Pin to the triggering commit
        run: git reset --hard ${{ github.sha }}

      # Docker action: brings its own Python, so no setup-python here.
      - name: Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .github/release.toml
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com

  # 2. Documentation & release assets
  build:
    name: Build docs & assets
    runs-on: ubuntu-latest
    needs: [guard, release]
    # Run after a release was just cut, or on a manual dispatch. `always()` lets this run on
    # workflow_dispatch even though `release` is skipped then; the guard check still applies.
    if: |
      always() &&
      needs.guard.outputs.configured == 'true' &&
      (needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      # Attach the archives to the Release.
      contents: write
    steps:
      # The release tag holds the bumped version and updated changelog; empty on manual dispatch
      # (falls back to the run's ref).
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      # --- C# API reference ---

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install SideXP.Instadoc
        run: dotnet tool install --global SideXP.Instadoc

      # Auto-detect the package's C# source folders so this works for runtime-only, editor-only,
      # hybrid, demo and asset-only packages with no per-package edits. If no C# sources exist,
      # API generation is skipped and the docs build still proceeds.
      - name: Generate API reference
        run: |
          inputs=""
          for d in Runtime Editor Demos; do
            if [ -d "$d" ] && find "$d" -name '*.cs' -print -quit | grep -q .; then
              inputs="$inputs --input $d"
            fi
          done
          if [ -n "$inputs" ]; then
            echo "Generating API reference from:$inputs"
            instadoc $inputs --output "Documentation~/api"
          else
            echo "No C# sources found - skipping API reference generation."
          fi

      # --- Documentation site ---

      # Generate the docs index (Documentation~/README.md) from the repo-root README.md.
      # See the docs:remove / docs:only markers in README.md.
      - name: Generate docs index
        run: |
          sed -e '/<!-- docs:remove:start -->/,/<!-- docs:remove:end -->/d' \
              -e '/<!-- docs:only:start/d' \
              -e '/docs:only:end -->/d' \
              -e 's#\./Documentation~/#./#g' \
              README.md > "Documentation~/README.md"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Zensical + side-xp theme
        run: pip install "git+https://github.com/side-xp/py-zensical-theme"

      - name: Build site
        run: zensical build -f "Documentation~/zensical.toml"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation~/site

      # --- Release archives (only when a release was cut, never on manual dispatch) ---

      - name: Read package name
        if: needs.release.outputs.released == 'true'
        id: pkg
        run: echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"

      # Source archives, honoring .gitattributes `export-ignore`. Built from the committed tree, so
      # the generated docs above never end up in them.
      - name: Build source archives
        if: needs.release.outputs.released == 'true'
        run: |
          git archive --format=zip    -o "${{ steps.pkg.outputs.name }}.zip"    HEAD
          git archive --format=tar.gz -o "${{ steps.pkg.outputs.name }}.tar.gz" HEAD

      # Zip Documentation~ (incl. the generated api/ and README.md, excl. the site config and the build
      # output) into Documentation_<tag>.zip.
      - name: Build documentation archive
        if: needs.release.outputs.released == 'true'
        working-directory: Documentation~
        run: |
          zip -r -q "../Documentation_${{ needs.release.outputs.tag }}.zip" . \
            -x "zensical.toml" -x ".nav.yml" -x "site/*" -x ".cache/*"

      - name: Upload release assets
        if: needs.release.outputs.released == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}.tar.gz
            Documentation_${{ needs.release.outputs.tag }}.zip

  # 3. GitHub Pages deployment
  # Kept as its own job so the Pages permissions and environment stay apart from `build`'s
  # `contents: write`.
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: build
    # `always()` because `release` is skipped on manual dispatch, which would otherwise skip this too.
    if: always() && needs.build.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
